name: Release

# Every push to prod is a release from dev. First it migrates production's
# database (Neon main). Then semantic-release gives the web, the api and the
# Android app their next version from the commits since each one's last tag
# (scripts/release/config.mjs): it writes it into the app's package.json and
# CHANGELOG.md, commits that to prod, tags it (web-v1.2.0, api-v1.2.0,
# mobile-v1.2.0) and publishes a GitHub release; a mobile-v tag then builds
# the APK (android.yml). Then prod goes back into dev, so both branches
# hold the same versions. Vercel deploys production only from these release
# commits (scripts/vercel-ignore.mjs), so a failed run means no deploy, and
# the new api never runs before its migration.
#
# The release app, a GitHub App, does the pushes (docs/deploy.md, part E).
# Its pushes run the other workflows as any push does, and the workflow's
# own GITHUB_TOKEN's would not: android.yml must run on the mobile-v tag,
# and CI on the release commits. If prod and dev get rulesets, the app goes
# in their bypass lists.

on:
  push:
    branches: [prod]

permissions:
  contents: read

jobs:
  release:
    name: Release web, api and mobile
    # The release commits come back here as pushes to prod: nothing to do.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The prod environment holds the app's key and production's
    # DATABASE_URL_UNPOOLED: only prod can read them.
    environment: prod
    # One release at a time, never cancelled halfway. Here and not on the
    # workflow, so the skipped runs above don't take a queued release's place.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Get a token for the release app
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # prod's tip, not the commit that triggered the run: a rerun after a
      # partial release must start from the release commits already pushed.
      # The whole history and its tags: each app counts from its last tag.
      - uses: actions/checkout@v7
        with:
          ref: prod
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # semantic-release runs on Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # Before any release commit: Vercel builds the production api only from
      # its release commit, so the new code never runs before its migration,
      # and a failed migration releases nothing. The api already published
      # keeps serving meanwhile, so migrations stay backward compatible
      # (CLAUDE.md). This job is the only one that migrates production, and
      # its concurrency group keeps two releases from migrating at once.
      - name: Migrate the production database
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::The prod environment has no DATABASE_URL_UNPOOLED secret (see docs/deploy.md)."
            exit 1
          fi
          bun run db:migrate

      # The release commits and the merge into dev show up as the app's bot.
      # semantic-release reads these variables, not git config.
      - name: Commit as the release app
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          name="${APP_SLUG}[bot]"
          email="${id}+${APP_SLUG}[bot]@users.noreply.github.com"
          {
            echo "GIT_AUTHOR_NAME=$name"
            echo "GIT_AUTHOR_EMAIL=$email"
            echo "GIT_COMMITTER_NAME=$name"
            echo "GIT_COMMITTER_EMAIL=$email"
          } >> "$GITHUB_ENV"

      - name: Release the web
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP: web
        run: bun run release

      # Its tag, pushed with the app's token, starts android.yml.
      - name: Release the Android app
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP: mobile
        run: bun run release

      - name: Release the api
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP: api
        run: bun run release

      # A fast-forward when dev has not moved since the release, a merge
      # commit when it has.
      - name: Bring prod back into dev
        run: |
          git fetch origin dev
          git switch --detach origin/dev
          if ! git merge --no-edit -m "chore(release): merge prod into dev" prod; then
            echo "::error::prod does not merge cleanly into dev. Open a pull request from prod to dev and resolve it there."
            exit 1
          fi
          git push origin HEAD:dev
