name: Migrate

# Applies the pending Drizzle migrations to Neon's dev branch on every push
# to dev. The GitHub Environment dev holds that branch's
# DATABASE_URL_UNPOOLED secret. Vercel deploys the dev api at the same time,
# so every migration must be backward compatible (see CLAUDE.md).
#
# Production migrates in release.yml, before the api's release commit
# exists. Vercel builds the production api only from that commit, so the new
# code never runs before its migration. That replaces Vercel's Deployment
# Checks, which hung the api whenever this job finished before Vercel
# started waiting for it.

on:
  push:
    branches: [dev]
  # A manual rerun on dev, e.g. after fixing the secret.
  workflow_dispatch:

# One run at a time per database. A new run waits for the current one
# instead of cancelling a migration halfway.
concurrency:
  group: migrate-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate database (dev)
    # prod migrates in release.yml.
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::The dev environment has no DATABASE_URL_UNPOOLED secret (see docs/deploy.md)."
            exit 1
          fi
          bun run db:migrate
